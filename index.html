<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="to-do-app">
        <h2>To-do List <img src="assets/icon.png" alt="" /></h2>

        <div class="row">
          <input
            type="text"
            class="input-box"
            placeholder="Add your doing things"
          />
          <button>Add</button>
        </div>
        <ul id="list-container">
          <li>
            <button onclick="toggleMode(this)">
              <img class="untoggle" src="assets/unchecked.png" alt="" /></button
            >Task 1
          </li>
          <li>
            <button onclick="toggleMode(this)">
              <img class="untoggle" src="assets/unchecked.png" alt="" /></button
            >Task 2
          </li>
          <li>
            <button onclick="toggleMode(this)">
              <img class="untoggle" src="assets/unchecked.png" alt="" /></button
            >Task 3
          </li>
        </ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
